<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tork® - Higiene profesional para los desafíos de hoy y del mañana</title>
 
    <link rel="stylesheet" href="css/styles.css">


</head>
<body>

     <header class="main-header">
      <div class="header-container">
        
        <a href="#" class="logo-container">
          <img src="assets/Union.png" alt="Tork Logo" class="logo-img">
        </a>

        <div class="search-bar">
          <input type="text" placeholder="¿Qué buscas hoy?">
          <button type="button" class="search-btn"></button>
          <img src="assets/search.png" class="search-icon-img">
        </div>

        <nav class="header-actions">
          <a href="#ayuda" class="action-link">Ayuda</a>

          <a href="#login" class="action-link login-link">
          <img src="assets/account_circle.png" alt="User" class="login-icon-img">Inicia sesión</a>

          <a href="#carrito" class="cart-btn">
         <img src="assets/Vector.png" alt="Cart" class="cart-icon-img">
        
         <span class="cart-count">0</span>
      </a>
        </nav>
        
      </div>

    </header>

    <main>

        <section class="hero-section">
          <img src="assets/Group 1.png" alt="Hero" class="hero-img">
        </section>

        <div class="countdown-card">
          <p class="countdown-text">Regístrate y descarga la guía de optimización de costos</p>
          <a href="#" class="btn-register btn-registrer">Quiero registrarme</a>
        </div>

    </main>

    <script type="module" src="js/app.js"></script>
    
</body>
</html>
